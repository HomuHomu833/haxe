# DO NOT EDIT. Generated from /extra/github-actions
# TODO: support skip ci (https://github.community/t/github-actions-does-not-respect-skip-ci/17325/8)

name: CI
on: [push, pull_request]

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    env:
      PLATFORM: linux64
      OPAMYES: 1
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["4.14.0"]
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam/
          key: ${{ runner.os }}-${{ matrix.ocaml }}-${{ hashFiles('./haxe.opam', './libs/') }}

      - name: Install Neko from S3
        run: |
          set -ex
          curl -sSL https://build.haxe.org/builds/neko/$PLATFORM/neko_latest.tar.gz -o $RUNNER_TEMP/neko_latest.tar.gz
          tar -xf $RUNNER_TEMP/neko_latest.tar.gz -C $RUNNER_TEMP
          NEKOPATH=`echo $RUNNER_TEMP/neko-*-*`
          sudo mkdir -p /usr/local/bin
          sudo mkdir -p /usr/local/include
          sudo mkdir -p /usr/local/lib/neko
          sudo ln -s $NEKOPATH/{neko,nekoc,nekoml,nekotools}  /usr/local/bin/
          sudo ln -s $NEKOPATH/libneko.*                      /usr/local/lib/
          sudo ln -s $NEKOPATH/include/*                      /usr/local/include/
          sudo ln -s $NEKOPATH/*.ndll                         /usr/local/lib/neko/
          echo "NEKOPATH=$NEKOPATH" >> $GITHUB_ENV

      - name: Print Neko version
        run: neko -version 2>&1

      - name: Install dependencies
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy darcs bubblewrap ocaml-nox libpcre2-dev zlib1g-dev libgtk2.0-dev libmbedtls-dev ninja-build libstring-shellquote-perl libipc-system-simple-perl
          curl -sSL https://github.com/ocaml/opam/releases/download/2.3.0/opam-2.3.0-x86_64-linux -o $RUNNER_TEMP/opam
          sudo install $RUNNER_TEMP/opam /usr/local/bin/opam

      - name: Install OCaml libraries
        if: steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          cd /tmp ; wget -q https://skarnet.org/toolchains/native/x86_64-linux-musl_pc-14.2.0.tar.xz
          cd /usr/local ; sudo tar -xf /tmp/x86_64-linux-musl_pc-14.2.0.tar.xz
          sudo ln -sf /usr/local/x86_64-linux-musl_pc-14.2.0/lib/libc.so /usr/local/x86_64-linux-musl_pc-14.2.0/bin/ldd
          sudo ln -sf /usr/local/x86_64-linux-musl_pc-14.2.0/lib/libc.so /lib/ld-musl-x86_64.so.1
          export PATH="/usr/local/x86_64-linux-musl_pc-14.2.0/bin:$PATH" ; hash -r
          export LD_LIBRARY_PATH="/usr/local/x86_64-linux-musl_pc-14.2.0/lib"
          cd ${{ github.workspace }}
          opam init # --disable-sandboxing
          opam update
          opam switch create ${{ matrix.ocaml }}+muslnative+flambda ocaml-variants.${{ matrix.ocaml }}+options ocaml-option-flambda
          eval $(opam env --switch=${{ matrix.ocaml }}+muslnative+flambda)
          opam pin add haxe . --no-action
          opam install haxe --deps-only --assume-depexts
          opam list
          ocamlopt -v

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      - name: Build Haxe
        run: |
          set -ex
          eval $(opam env --switch=${{ matrix.ocaml }}+muslnative+flambda)
          opam config exec -- make STATICLINK=1 -s -j`nproc` haxe
          opam config exec -- make STATICLINK=1 -s haxelib
          make STATICLINK=1 -s package_unix
          ls -l out
          ldd -v ./haxe
          ldd -v ./haxelib

      # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build xmldoc
        if: matrix.ocaml == '4.14.0'
        run: |
          set -ex
          make -s xmldoc
          cat >extra/doc/info.json <<EOL
            {
              "commit": "$GITHUB_SHA",
              "branch": "${{ steps.extract_branch.outputs.branch }}"
            }
          EOL

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxBinaries${{ (matrix.ocaml == '5.3.0' && '_ocaml5') || '' }}
          path: out

      - name: Upload xmldoc artifact
        uses: actions/upload-artifact@v4
        if: matrix.ocaml == '4.14.0'
        with:
          name: xmldoc
          path: extra/doc

  linux-arm64-build:
    runs-on: ubuntu-22.04-arm
    env:
      PLATFORM: linux-arm64
      OPAMYES: 1
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam/
          key: arm-${{ runner.os }}-${{ hashFiles('./haxe.opam', './libs/') }}

      - name: Install Neko from S3
        run: |
          set -ex
          curl -sSL https://build.haxe.org/builds/neko/$PLATFORM/neko_latest.tar.gz -o $RUNNER_TEMP/neko_latest.tar.gz
          tar -xf $RUNNER_TEMP/neko_latest.tar.gz -C $RUNNER_TEMP
          NEKOPATH=`echo $RUNNER_TEMP/neko-*-*`
          sudo mkdir -p /usr/local/bin
          sudo mkdir -p /usr/local/include
          sudo mkdir -p /usr/local/lib/neko
          sudo ln -s $NEKOPATH/{neko,nekoc,nekoml,nekotools}  /usr/local/bin/
          sudo ln -s $NEKOPATH/libneko.*                      /usr/local/lib/
          sudo ln -s $NEKOPATH/include/*                      /usr/local/include/
          sudo ln -s $NEKOPATH/*.ndll                         /usr/local/lib/neko/
          echo "NEKOPATH=$NEKOPATH" >> $GITHUB_ENV

      - name: Print Neko version
        run: neko -version 2>&1

      - name: Install dependencies
        run: |
          set -ex
          sudo apt-get update -qqy
          sudo apt-get install -qqy ocaml-nox opam libpcre2-dev zlib1g-dev libgtk2.0-dev libmbedtls-dev libipc-system-simple-perl libstring-shellquote-perl ninja-build

      - name: Install OCaml libraries
        if: steps.cache-opam.outputs.cache-hit != 'true'
        run: |
          set -ex
          cd /tmp ; wget -q https://skarnet.org/toolchains/native/aarch64-linux-musl_pi3-14.2.0.tar.xz
          cd /usr/local ; sudo tar --exclude='aarch64-linux-musl_pi3-14.2.0/usr' -xf /tmp/aarch64-linux-musl_pi3-14.2.0.tar.xz
          mkdir usr ; cd usr
          sudo ln -s ../aarch64-linux-musl aarch64-linux-musl
          sudo ln -s ../bin bin
          sudo ln -s ../include include
          sudo ln -s ../lib lib
          sudo ln -s ../lib lib64
          sudo ln -s ../libexec libexec
          sudo ln -s ../share share
          sudo ln -sf /usr/local/aarch64-linux-musl_pi3-14.2.0/lib/libc.so /usr/local/aarch64-linux-musl_pi3-14.2.0/bin/ldd
          sudo ln -sf /usr/local/aarch64-linux-musl_pi3-14.2.0/lib/libc.so /lib/ld-musl-aarch64.so.1
          export PATH="/usr/local/aarch64-linux-musl_pi3-14.2.0/bin:$PATH" ; hash -r
          export LD_LIBRARY_PATH="/usr/local/aarch64-linux-musl_pi3-14.2.0/lib"
          opam init # --disable-sandboxing
          opam update
          opam switch create 4.13.1+muslnative+flambda ocaml-variants.4.13.1+options ocaml-option-flambda
          eval $(opam env --switch=4.13.1+muslnative+flambda)
          opam pin add haxe . --no-action
          opam install haxe --deps-only --assume-depexts
          opam list
          ocamlopt -v

      - name: Set ADD_REVISION=1 for non-release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "ADD_REVISION=1" >> $GITHUB_ENV

      - name: Build Haxe
        run: |
          set -ex
          eval $(opam env --switch=4.13.1+muslnative+flambda)
          opam config exec -- make STATICLINK=1 -s -j`nproc` haxe
          opam config exec -- make STATICLINK=1 -s haxelib
          make STATICLINK=1 -s package_unix
          ls -l out
          ldd -v ./haxe
          ldd -v ./haxelib

      # https://stackoverflow.com/questions/58033366/how-to-get-current-branch-within-github-actions
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxArm64Binaries
          path: out
